      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Install
        run: |
          sudo apt-get update
          # What the SDL build and the studio itself need; the shipping jobs
          # carry sokol's X11 link line instead.
          sudo apt-get install -y libglu1-mesa-dev libasound2-dev libpulse-dev libaudio-dev libsamplerate0-dev libcurl4-openssl-dev
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          command -v ccache >/dev/null || sudo apt-get install -y ccache

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Build
        run: |
          set -euo pipefail
          start=$SECONDS
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DBUILD_SDL=ON -DBUILD_SOKOL=OFF -DBUILD_SDLGPU=On -DBUILD_WITH_ALL=ON
          cmake --build build --parallel
          echo "sdl build: $((SECONDS - start))s"
          du -h build/bin/tic80

      - uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-linux-sdl"
          path: |
            build/bin/tic80

