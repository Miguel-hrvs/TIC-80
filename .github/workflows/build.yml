  # === Android (sokol) ===
  android:
    # 24.04, not -latest: setup-ruby has no 2.6.10 for 26.04 (#3107).
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          
      - name: Apply Lua TIC-80 patches
        run: |
          set -euo pipefail
          git apply build/lua5.4.patch

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0 platforms;android-31 ndk;30.0.16248370"

      - name: Install ccache
        run: command -v ccache >/dev/null || { sudo apt-get update && sudo apt-get install -y ccache; }

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.job }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-${{ runner.arch }}-

      - name: Build
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/30.0.16248370"

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              export UNSIGNED=1
              echo "fork pull request: no repository secrets, the APKs are unsigned"
          else
              : "${RELEASE_STORE_PASSWORD:?RELEASE_STORE_PASSWORD secret is not set}"
              : "${RELEASE_KEY_PASSWORD:?RELEASE_KEY_PASSWORD secret is not set}"
          fi

          common=(-DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake"
                  -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
                  -DCMAKE_BUILD_TYPE=Release
                  -DBUILD_SOKOL=ON -DBUILD_SDL=OFF
                  -DBUILD_WITH_ALL=ON -DBUILD_TOUCH_INPUT=ON
                  -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)

          cmake -S . -B build-android -G Ninja "${common[@]}"
          cmake --build build-android --parallel
          build/android-sokol/apk.sh build-android/bin/libtic80.so build/android-sokol/tic80.apk

          cmake -S . -B build-android-surf -G Ninja "${common[@]}" -DBUILD_EDITORS=OFF -DBUILD_SURF=ON
          cmake --build build-android-surf --parallel
          build/android-sokol/apk.sh build-android-surf/bin/libtic80.so build/android-sokol/tic80-surf.apk com.nesbox.tic.surf

      - name: Check what each APK carries
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          unzip -p build/android-sokol/tic80.apk lib/arm64-v8a/libtic80.so > editors.so
          unzip -p build/android-sokol/tic80-surf.apk lib/arm64-v8a/libtic80.so > surf.so

          grep -qa "SPRITE EDITOR" editors.so || {
            echo "the APK has no editors — BUILD_EDITORS did not take" >&2
            exit 1
          }
          grep -qa "You don't have any files" surf.so || {
            echo "the browser-only APK has no browser — BUILD_EDITORS=OFF did not take" >&2
            exit 1
          }
          grep -qa "SPRITE EDITOR" surf.so && {
            echo "the browser-only APK carries the editors" >&2
            exit 1
          }

          for apk in tic80 tic80-surf; do
            unzip -l "build/android-sokol/$apk.apk" | grep -q "classes.dex" || {
              echo "$apk carries no dex — the documents provider is missing" >&2
              exit 1
            }
            unzip -p "build/android-sokol/$apk.apk" classes.dex | grep -qa "TICDocumentsProvider" || {
              echo "$apk's dex is not the documents provider" >&2
              exit 1
            }
            unzip -p "build/android-sokol/$apk.apk" classes.dex | grep -qa "TICActivity" || {
              echo "$apk's dex has no activity — the .tic intents cannot work" >&2
              exit 1
            }
            manifest=$("$TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "build/android-sokol/$apk.apk")
            echo "$manifest" | grep -q "hasCode(0x0101000c)=true" || {
              echo "$apk's manifest has hasCode off — the provider cannot load" >&2
              exit 1
            }
            case "$apk" in
              tic80) authority=com.nesbox.tic.documents ;;
              tic80-surf) authority=com.nesbox.tic.surf.documents ;;
            esac
            echo "$manifest" | grep -q "TICDocumentsProvider" || {
              echo "$apk's manifest has no documents provider" >&2
              exit 1
            }
            echo "$manifest" | grep -q "com.nesbox.tic.TICActivity" || {
              echo "$apk's manifest has no activity" >&2
              exit 1
            }
            echo "$manifest" | grep -q "authorities(0x01010018)=\"$authority\"" || {
              echo "$apk's provider authority is not $authority" >&2
              exit 1
            }
            "$TOOLS/aapt2" dump badging "build/android-sokol/$apk.apk" | grep "^package:"
          done

          "$TOOLS/aapt2" dump badging build/android-sokol/tic80.apk | grep -q "package: name='com.nesbox.tic'" || {
            echo "the editors APK has the wrong package id" >&2
            exit 1
          }
          "$TOOLS/aapt2" dump badging build/android-sokol/tic80-surf.apk | grep -q "package: name='com.nesbox.tic.surf'" || {
            echo "the browser-only APK has the wrong package id" >&2
            exit 1
          }
          "$TOOLS/aapt2" dump badging build/android-sokol/tic80.apk | grep -q "minSdkVersion:'26'" || {
            echo "the APK's minSdk is not 26" >&2
            exit 1
          }

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-android"
          path: build/android-sokol/tic80.apk

      - name: Deploy the browser-only APK
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-android-surf"
          path: build/android-sokol/tic80-surf.apk

  # === Raspberry PI 2 Bare Metal ===
  rpi2-baremetal:
    runs-on: ubuntu-24.04
    container: miguelhrvs/baremetalapi-tic80@sha256:3338c759e9b75acda306c21918edb07a5413267a8fa5c9eaf4cc1a102488f93a

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          
      - name: Apply Lua TIC-80 patches
        run: |
          set -euo pipefail
          git apply build/lua5.4.patch

      - name: Prebuild
        run: |
          cd vendor
          git clone --recursive https://github.com/smuehlst/circle-stdlib
          cd circle-stdlib
          git checkout db053a32c165c1b22423a47ed6cb5bddc72b51f2
          git submodule update --recursive
          ./configure -r 2
          make -j$(nproc)
          cd libs/circle/addon/vc4/sound/
          make -j$(nproc)
          cd ../vchiq
          make -j$(nproc)
          cd ../../linux
          make -j$(nproc)

      - name: Build
        run: |
          git apply build/baremetalpi/circle.patch
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=baremetalpi/toolchain.cmake \
                -DCMAKE_C_FLAGS=" -DMINIZ_NO_TIME -DTIC_BUILD_WITH_LUA -DLUA_32BITS -std=c99 -march=armv7-a+neon-vfpv4 -D AARCH=32 -D __circle__ -D BAREMETALPI --specs=nosys.specs -O2 -mabi=aapcs -marm -mfloat-abi=hard -mfpu=neon-vfpv4 -D__DYNAMIC_REENT__ -Wno-error -Wno-unused-parameter -Wno-error=format -Wno-format -Wno-error=unused-function -Wno-error=sign-compare -Wno-error=stringop-truncation -w" \
                -DCMAKE_CXX_FLAGS=" -DMINIZ_NO_TIME -DLUA_32BITS -march=armv7-a+neon-vfpv4 -D AARCH=32 -D __circle__ -D BAREMETALPI --specs=nosys.specs -O2 -mabi=aapcs -marm -mfloat-abi=hard -mfpu=neon-vfpv4 -D__DYNAMIC_REENT__ -Wno-error -Wno-unused-parameter -Wno-error=format -Wno-format -Wno-error=unused-function -Wno-error=sign-compare -Wno-error=stringop-truncation -w" \
                ..
          make tic80studio -j$(nproc)
          cd baremetalpi
          make -j$(nproc)
          cd ../../vendor/circle-stdlib/libs/circle/boot/
          make -j$(nproc)

      - name: Pack
        run: |
          cp build/baremetalpi/kernel7.img vendor/circle-stdlib/libs/circle/boot/kernel.img
          cp build/baremetalpi/boot/config.txt vendor/circle-stdlib/libs/circle/boot/config.txt

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: "tic80-rpi2-baremetal"
          path: |
            vendor/circle-stdlib/libs/circle/boot/bcm2710-rpi-zero-2-w.dtb
            vendor/circle-stdlib/libs/circle/boot/config.txt
            vendor/circle-stdlib/libs/circle/boot/kernel.img
            vendor/circle-stdlib/libs/circle/boot/bootcode.bin
            vendor/circle-stdlib/libs/circle/boot/start.elf
            vendor/circle-stdlib/libs/circle/boot/fixup.dat
            vendor/circle-stdlib/libs/circle/boot/LICENCE.broadcom
